name: Sync Calendar Events

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync events from Google Calendar
        env:
          GCAL_API_KEY: ${{ secrets.GCAL_API_KEY }}
        run: node scripts/sync-events.mjs

      - name: Commit events.json if it changed
        run: |
          if git diff --quiet -- events.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Sync events from Google Calendar [skip ci]"
          git push
